[package]
name = "pb-testnet-outlayer-mock"
description = "Sandbox stand-in for OutLayer: request_execution yields until a test hook resumes it with a canned verdict (PLAN.md 5.1); testnet and sandbox only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
