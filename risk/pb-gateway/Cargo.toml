[package]
name = "pb-gateway"
description = "pb-gateway: the OutLayer program that checks and signs every Hyperliquid order (PLAN.md 5.3, INTERFACES.md 9, RISK_ENGINE.md 9)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The library is pure (requests, reads and storage behind traits), so every mode is tested natively. The binary adds
# OutLayer's storage, environment and the WASI HTTP transport, and only does real work for wasm32.
[lib]
path = "src/lib.rs"

[[bin]]
name = "pb-gateway"
path = "src/main.rs"

[dependencies]
risk-core = { path = "../risk-core" }
pb-read = { path = "../pb-read" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
# The agent key: secp256k1 ECDSA with RFC 6979 nonces, so the same message gets the same signature.
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "arithmetic"] }
# Keccak-256 for EIP-712 and Ethereum addresses.
sha3 = { version = "=0.12.0", default-features = false }
# Hyperliquid's L1 actions are hashed as msgpack, keys in the SDK's order.
rmp-serde = "=1.3.1"
# The agent key from the seed (RFC 5869); hkdf 0.13 takes sha2 0.11's Sha256.
hkdf = "=0.13.0"
sha2 = { version = "=0.11.1", default-features = false }
# NEP-413: the owner's ed25519 signature, its base58 public key and base64 fields.
ed25519-dalek = { version = "=3.0.0", default-features = false }
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"] }
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# OutLayer storage (the P0 lock, the nonce store and the order ledger).
outlayer = "=0.2.1"
