[package]
name = "pb-read"
description = "The reads pb-risk and pb-gateway share: NEAR views, Hyperliquid info and prices, and the book the engine runs on (INTERFACES.md 6, 9, 10)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The reads are written against a transport trait, so tests replay canned answers natively. The WASI HTTP transport
# (`wasi_net`) only builds for wasm32.
[dependencies]
risk-core = { path = "../risk-core" }
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip: a number parsed back from the inputs file has the bits it was read with.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = { version = "=0.10.9", default-features = false }
# ln() for the volatility, the same bits natively and in WASM (the platform's own log can differ).
libm = "=0.2.16"

[dev-dependencies]
# keccak-256, to recompute the Aave selectors in tests (already in the workspace's lock file through pb-gateway).
sha3 = { version = "=0.12.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WASI HTTP directly (as wasi-http-client 0.2.1 does), so each call can have first-byte and read timeouts.
wasi = "=0.13.3"
