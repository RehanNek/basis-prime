# The risk and credit engine (PLAN.md 5.6, RISK_ENGINE.md). risk-core is a pure library; pb-risk and
# pb-gateway are OutLayer programs (wasm32-wasip2), and pb-read is the reading code they share; backtest is a
# native CLI. probe (pb-ol-probe) is the Phase 0 OutLayer test program (wasm32-wasip2).
[workspace]
resolver = "3"   # picks dependency versions that support our rust-version
members = ["risk-core", "pb-read", "pb-risk", "pb-gateway", "backtest", "probe"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.93"
license = "MIT"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
